<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="TMDB movie list details."><title>List — Movie Centre</title><link rel="icon" href="assets/logo.svg"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="navigation.css"><link rel="stylesheet" href="movies.css"><style>.list-detail-page{background:#f6f6f4;min-height:80vh;padding:65px 0}.list-detail-head{background:#111;color:#fff;border-radius:22px;padding:40px;margin-bottom:30px}.list-detail-head h1{font-size:clamp(40px,6vw,72px);line-height:.9;letter-spacing:-.06em;margin:8px 0}.list-detail-head p{color:#aaa;max-width:760px}..list-items{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}.list-item{background:#fff;border:1px solid #e5e5e5;border-radius:14px;overflow:hidden}.list-item img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}.list-item-body{padding:12px}.list-item-body strong{display:block}.list-item-body small{color:#888}..list-empty{padding:55px;text-align:center;border:1px dashed #ccc;border-radius:15px;color:#777;grid-column:1/-1}@media(max-width:900px){.list-items{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.list-items{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header data-global-nav></header><main class="list-detail-page"><div class="container"><a class="movie-back" href="lists.html">← Back to My Lists</a><section id="listDetailRoot"><div class="list-empty">Loading list…</div></section></div></main><script src="navigation.js"></script><script src="tmdb-lists.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const root=document.getElementById('listDetailRoot'),id=new URLSearchParams(location.search).get('id');if(!id){root.innerHTML='<div class="list-empty">No list selected.</div>';return}try{const d=await TMDBLists.api('/api/tmdb-user/lists/'+encodeURIComponent(id));document.title=(d.name||'List')+' — Movie Centre';const items=d.results||[];root.innerHTML=`<div class="list-detail-head"><span class="eyebrow">TMDB LIST</span><h1>${String(d.name||'Untitled list').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}</h1><p>${String(d.description||'Your saved movie collection.').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}</p></div><div class="list-items">${items.length?items.map(v=>{const title=String(v.title||v.name||'Untitled').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const p=v.poster_path?'https://image.tmdb.org/t/p/w500'+v.poster_path:'';return `<a class="list-item" href="movie-detail.html?id=${encodeURIComponent(v.id)}"><img src="${p}" alt="${title}" loading="lazy"><div class="list-item-body"><strong>${title}</strong><small>${(v.release_date||'').slice(0,4)||'—'}</small></div></a>`}).join(''):'<div class="list-empty">This list has no movies yet. Open a movie and use “Add to list”.</div>'}</div>`}catch(e){root.innerHTML='<div class="list-empty">'+String(e.message||'Unable to load list.').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))+'</div>'}});</script></body></html>
